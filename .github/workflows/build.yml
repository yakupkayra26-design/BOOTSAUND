name: Build Dil Koprusu

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install libnx
        run: dkp-pacman -S --needed --noconfirm switch-dev
      - name: Build overlay
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Dil-Koprusu-V1.00
          path: SwitchTurkceOverlay.nro
