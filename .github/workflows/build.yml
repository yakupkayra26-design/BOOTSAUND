name: Build Switch BootSound

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install libnx
        run: dkp-pacman -S --needed --noconfirm switch-dev switch-sdl2 switch-sdl2_ttf switch-sdl2_gfx switch-freetype switch-harfbuzz

      - name: Build GUI and sysmodule
        run: make

      - name: Upload Switch packages
        uses: actions/upload-artifact@v4
        with:
          name: BootSound-V2.01
          path: |
            V2.01.nro
            BootSoundSysmodule.nsp
