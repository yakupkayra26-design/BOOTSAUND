name: Build Switch BootSound

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install libnx
        run: dkp-pacman -S --needed --noconfirm switch-dev

      - name: Build App
        run: make V1.nro

      - name: Upload NRO Output
        uses: actions/upload-artifact@v4
        with:
          name: V1-NRO
          path: V1.nro
